name: CI

on:
  push:
    branches: [ "main", "feature/**", "chore/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: List repository files
        run: ls -la

      - name: Basic project check
        run: |
          echo "Running CI for CampusEats Task Tracker"
          test -f README.md && echo "README found"
          test -f src/tasks.js && echo "tasks.js found"
          test -f .gitignore && echo ".gitignore found"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Run security audit
        run: npm audit --audit-level=high || true
