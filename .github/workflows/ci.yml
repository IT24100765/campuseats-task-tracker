name: CI

on:
  push:
    branches: [ "main", "feature/**", "chore/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.0

      - name: Confirm project files exist
        run: |
          test -f README.md
          test -f src/tasks.js
          test -f .gitignore
          echo "Project files verified."

      - name: Set up Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm install

      - name: Skip install when package.json is missing
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "No package.json found; skipping npm install."

      - name: Run tests
        if: ${{ hashFiles('package.json') != '' }}
        run: npm test --if-present

      - name: Security audit
        if: ${{ hashFiles('package.json') != '' }}
        run: npm audit --audit-level=high || true
